# FreeLinX/ports default configuration.
#
# This is a POSIX shell fragment sourced by scripts/common.sh (and read by
# mk/common.mk). Values use the ${VAR:-default} idiom so that FREELINX_*
# environment variables set before running a tool take precedence.
#
# No absolute, user-specific paths are hard-coded. Relative defaults resolve
# against this repository root (FREELINX_ROOT), treated as a sibling of the
# other FreeLinX repositories under FreeLinX/.

# Target architecture and ABI triple.
FREELINX_ARCH=${FREELINX_ARCH:-x86_64}
FREELINX_TRIPLE=${FREELINX_TRIPLE:-x86_64-linux-musl}

# ---------------------------------------------------------------------------
# Toolchain.
#
# FreeLinX uses a configurable external toolchain produced by FreeLinX/toolchain.
# It must never be assumed to live at a hard-coded developer path. The values
# below default to the sibling toolchain repository layout; override them with
# FREELINX_* environment variables to point at a real compiler/linker/sysroot.
# ---------------------------------------------------------------------------
# The FreeLinX/toolchain repository (used to locate its output).
FREELINX_TOOLCHAIN_DIR=${FREELINX_TOOLCHAIN_DIR:-"${FREELINX_ROOT}/../toolchain"}

# Directory holding the toolchain binaries (clang, ld.lld).
FREELINX_TOOLCHAIN_BIN=${FREELINX_TOOLCHAIN_BIN:-"${FREELINX_TOOLCHAIN_DIR}/bin"}

# Canonical driver names. clang is used for building and linking; when LLD is
# needed it is selected with -fuse-ld=lld (or the ld.lld binary directly).
FREELINX_CC=${FREELINX_CC:-"${FREELINX_TOOLCHAIN_BIN}/clang"}
FREELINX_LD=${FREELINX_LD:-"${FREELINX_TOOLCHAIN_BIN}/ld.lld"}
FREELINX_AR=${FREELINX_AR:-"${FREELINX_TOOLCHAIN_BIN}/llvm-ar"}

# musl sysroot consumed by clang via --sysroot.
FREELINX_SYSROOT=${FREELINX_SYSROOT:-"${FREELINX_TOOLCHAIN_DIR}/x86_64-linux-musl"}

# Destination prefix for installed port artifacts (kept configurable; used as
# the root of the staging overlay). Defaults to staging/<triple> so multi-arch
# builds do not collide. The first port (NetBSD sh) stages to staging/bin/sh.
FREELINX_PREFIX=${FREELINX_PREFIX:-"${FREELINX_ROOT}/staging/${FREELINX_TRIPLE}"}

# Link mode. "static" (default during bootstrap, very useful) or "dynamic".
# Static is not forced for every future package; it is configurable here.
FREELINX_LINK_MODE=${FREELINX_LINK_MODE:-static}

# ---------------------------------------------------------------------------
# FreeLinX/src integration.
#
# The ports system stages its output into a rootfs-compatible overlay tree so
# that FreeLinX/src can consume it directly. The default tree is <repo>/staging
# (gitignored), and the eventual rootfs destination mirrors src/rootfs.
#
#   staging/bin/sh   ->   <FREELINX_SRC_DIR>/rootfs/bin/sh
#
# Both origins are configurable (never hard-coded), matching the sibling
# FreeLinX/src conventions (FREELINX_SRC_DIR, FREELLINX_ROOTFS_DIR).
# ---------------------------------------------------------------------------
# Rootfs overlay tree where ports stage their built output.
FREELINX_STAGING_ROOT=${FREELINX_STAGING_ROOT:-"${FREELINX_ROOT}/staging"}

# Destination where FreeLinX/src keeps its rootfs source template.
FREELINX_SRC_DIR=${FREELINX_SRC_DIR:-"${FREELINX_ROOT}/../src"}
FREELINX_ROOTFS_DIR=${FREELINX_ROOTFS_DIR:-"${FREELINX_SRC_DIR}/rootfs"}

# Backward-compatible alias consulted by the scripts for the historical
# "rootfs/bin" target (kept in sync with FREELINX_ROOTFS_DIR/bin).
FREELINX_ROOTFS_BIN=${FREELINX_ROOTFS_BIN:-"${FREELINX_ROOTFS_DIR}/bin"}

# ---------------------------------------------------------------------------
# Build output. Everything generated lives under the build/ directory so the
# repository stays source-oriented.
# ---------------------------------------------------------------------------
FREELINX_BUILD_DIR=${FREELINX_BUILD_DIR:-"${FREELINX_ROOT}/build"}
FREELINX_DIST_DIR=${FREELINX_DIST_DIR:-"${FREELINX_ROOT}/dist"}
FREELINX_STAGING_DIR=${FREELINX_STAGING_DIR:-"${FREELINX_STAGING_ROOT}"}

# One build work tree per port, keyed by port category/name.
FREELINX_WORK_DIR=${FREELINX_WORK_DIR:-"${FREELINX_BUILD_DIR}/work"}

# Number of parallel jobs for fetching/extracting.
FREELINX_JOBS=${FREELINX_JOBS:-1}
